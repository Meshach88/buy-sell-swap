; Keeps Laravel's queue worker running: payment webhooks, notifications and settlement jobs
; depend on it. Reload with: sudo supervisorctl reread && sudo supervisorctl update
[program:buysellswap-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/buysellswap/api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/buysellswap/api/storage/logs/worker.log
stopwaitsecs=3600
