# Nginx for one Namecheap VPS: the React app on the main domain, the Laravel API on api.
# Replace YOUR_DOMAIN and the PHP-FPM socket version, then enable with certbot for HTTPS.

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    root /var/www/buysellswap/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # Single-page app: unknown paths fall back to index.html.
    location / { try_files $uri /index.html; }
}

server {
    listen 80;
    server_name api.YOUR_DOMAIN;
    root /var/www/buysellswap/api/public;
    index index.php;
    client_max_body_size 12M; # listing photos

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
